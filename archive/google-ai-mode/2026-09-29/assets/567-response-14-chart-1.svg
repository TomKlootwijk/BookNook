<svg class="marks" height="429" style="background-color: rgb(39, 41, 48);;background:rgb(39, 41, 48);color:#e8eaed" version="1.1" viewBox="0 0 557 429" width="557" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><style>#vg-tooltip-element {
  visibility: hidden;
  padding: 8px;
  position: fixed;
  z-index: 1000;
  font-family: sans-serif;
  font-size: 11px;
  border-radius: 3px;
  box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
  /* The default theme is the light theme. */
  background-color: rgba(255, 255, 255, 0.95);
  border: 1px solid #d9d9d9;
  color: black;
}
#vg-tooltip-element.visible {
  visibility: visible;
}
#vg-tooltip-element h2 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 13px;
}
#vg-tooltip-element table {
  border-spacing: 0;
}
#vg-tooltip-element table tr {
  border: none;
}
#vg-tooltip-element table tr td {
  overflow: hidden;
  text-overflow: ellipsis;
  padding-top: 2px;
  padding-bottom: 2px;
}
#vg-tooltip-element table tr td.key {
  color: #808080;
  max-width: 150px;
  text-align: right;
  padding-right: 4px;
}
#vg-tooltip-element table tr td.value {
  display: block;
  max-width: 300px;
  max-height: 7em;
  text-align: left;
}
#vg-tooltip-element.dark-theme {
  background-color: rgba(32, 32, 32, 0.9);
  border: 1px solid #f5f5f5;
  color: white;
}
#vg-tooltip-element.dark-theme td.key {
  color: #bfbfbf;
}


      
      /* SDS utility classes are not available within the SafeContentFrame iframe. */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background-color: #22242a;
      }
      #vis {
        height: 100% !important;
        width: 100% !important;
        border-radius: 16px;
        overflow: hidden;
        touch-action: none;
      }
      
      #vg-tooltip-element.vg-tooltip.aim-theme {
        background-color: #25262ECC !important;
        border: 1px solid #2D2F35CC !important;
        font-family: 'Google Sans', Roboto, Arial, sans-serif !important;
        color: #E6E8F0 !important;
      }
      #vg-tooltip-element.vg-tooltip.aim-theme table tr td.key {
        color: #E6E8F0 !important;
      }
      #vg-tooltip-element.vg-tooltip.aim-theme table tr td {
        color: #ADAFB8 !important;
